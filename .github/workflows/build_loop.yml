name: 4. Build Loop Manual
run-name: Profiles PR 124 Compatibility Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_profiles:
    if: github.ref_name == 'next-dev-profiles-test'
    runs-on: xcode-27

    steps:
      - name: Checkout LoopWorkspace
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Profiles Patch
        run: |
          curl -fL https://raw.githubusercontent.com/loopandlearn/customization/0671e6dbdd47663721c770727a1d988d5b1ca1d6/profiles/nextdev_profiles.patch -o /tmp/profiles.patch

      - name: Check Profiles Patch
        run: |
          git apply --check --verbose --whitespace=nowarn /tmp/profiles.patch
          echo "Profiles patch compatibility check passed."
          
      - name: Apply Profiles Patch
        run: |
          git apply --whitespace=nowarn /tmp/profiles.patch

      - name: List Xcode Schemes
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -list -workspace LoopWorkspace.xcworkspace
